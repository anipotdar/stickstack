name: CI
on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: { python-version: '3.12' }
      - name: Fixtures
        run: pip install pillow==11.0.0 && python3 scripts/make_fixtures.py test/fixtures
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")
          python3 test/browser/run_render.py "$CHROME"
          python3 test/browser/run_web.py "$CHROME"
          python3 test/browser/run_extension.py "$CHROME"
      - name: Package
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: stickstack-extension
          path: dist/*.zip
