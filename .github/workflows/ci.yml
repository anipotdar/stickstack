name: CI
on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Fixtures
        run: pip install pillow==13.0.0 && python3 scripts/make_fixtures.py test/fixtures
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          CHROME=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")
          python3 test/browser/run_render.py "$CHROME"
          python3 test/browser/run_web.py "$CHROME"
          python3 test/browser/run_extension.py "$CHROME"
      - name: Package
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stickstack-extension
          path: dist/*.zip
